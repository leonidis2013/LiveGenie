# TrueNAS SCALE: Apps > Discover Apps > Custom App > "Install via YAML", paste this.
# Data is kept in the livegenie-data volume (internal storage, same as LiveMic):
# it survives updates and edits of the app. Change the host port if 9090 is taken.
# pull_policy: always means saving the app in TrueNAS pulls the newest LiveGenie.
services:
  livegenie:
    image: ghcr.io/leonidis2013/livegenie:latest
    pull_policy: always
    container_name: livegenie
    restart: unless-stopped
    ports:
      - "9090:8080"
    volumes:
      - livegenie-data:/data
    environment:
      TZ: America/Chicago

volumes:
  livegenie-data:
